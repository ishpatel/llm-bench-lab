[metadata]
name = llm-bench-lab
version = 1.3.0
description = Zero-dependency local-LLM benchmarking lab for NVIDIA RTX and Apple Silicon
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
url = https://github.com/ishpatel/llm-bench-lab

[options]
packages = llmbench
py_modules = bench
python_requires = >=3.9

[options.entry_points]
console_scripts =
    llmbench = bench:main
